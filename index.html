<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="PhDproof.com | Unified Field Systems">
<title>PhD Proof — Unified Field Systems</title>
<link rel="icon" type="image/svg+xml" href="logo/icon.svg">
<style>
html,body{margin:0;background:#0B1626;overflow-x:hidden}
main{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;box-sizing:border-box}
.logo img{width:100%;max-width:560px;height:auto;display:block}
.wrap{position:relative;width:100%;max-width:min(1600px,calc((100dvh - 260px) * 16 / 9))}
video{width:100%;height:auto;display:block;background:#000}
#snd{position:absolute;top:12px;right:12px;min-height:44px;padding:0 16px;border:0;border-radius:22px;background:#fff;font:600 15px system-ui;cursor:pointer}
@media(max-width:600px){main{justify-content:flex-start}.logo img{max-width:300px}}
</style>
</head>
<body>
<main>
<picture class="logo">
<source media="(max-width:600px)" srcset="logo/logo_stacked_dark.svg">
<img src="logo/logo_dark.svg" alt="PhDproof.com — powered by UFS">
</picture>
<div class="wrap">
<video id="v" src="intro.mp4" autoplay muted playsinline loop preload="auto"></video>
<button id="snd" type="button" aria-label="Tap for sound">🔊 Tap for sound</button>
</div>
</main>
<script>
const v=document.getElementById('v'),b=document.getElementById('snd');
b.onclick=()=>{v.muted=false;v.currentTime=0;v.controls=true;v.play();b.remove();};
</script>
</body>
</html>
