<!doctype html>
<html lang="en">
<head>

<style>
html,body{margin:0;background:#0b0b0f;color:#e8e8ee;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}

<main>
<div class="wrap">

<script>
var v=document.getElementById('v'),b=document.getElementById('snd');
b.addEventListener('click',function(){v.muted=false;v.currentTime=0;v.play();b.style.display='none';v.controls=true;});
</script>
